spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/capstone2026}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

mybatis:
    type-aliases-package: group12.Entities
    configuration:
        map-underscore-to-camel-case: true

server:
    port: 8081
    error:
        include-message: always

logging:
    file:
        name: logs/group-12-backend.log
    level:
        root: INFO
        group12: INFO
        org.mybatis: DEBUG
        org.springframework.jdbc: DEBUG

alpaca:
    api-key: ${ALPACA_API_KEY:}
    secret-key: ${ALPACA_SECRET_KEY:}
    data-url: ${ALPACA_MARKET_DATA_URL:https://data.alpaca.markets}
    feed: ${ALPACA_MARKET_DATA_FEED:iex}
    connect-timeout: ${ALPACA_CONNECT_TIMEOUT:2s}
    read-timeout: ${ALPACA_READ_TIMEOUT:5s}
    supported-us-equity-symbols:
        - NVDA
        - AAPL
        - MSFT
        - AMZN
        - GOOGL
        - GOOG
        - META
        - AVGO
        - TSLA
        - MU
        - BRK.B
        - LLY
        - AMD
        - JPM
        - WMT
        - V
        - XOM
        - INTC
        - JNJ
        - MA
        - ABBV
        - PLTR
        - CSCO
        - LRCX
        - AMAT
        - ORCL
        - COST
        - CVX
        - CAT
        - BAC
        - KO
        - MRK
        - DELL
        - PG
        - UNH
        - GE
        - PANW
        - MS
        - PM
        - NFLX
        - HD
        - CRWD
        - SNDK
        - KLAC
        - GS
        - GEV
        - ANET
        - TXN
        - RTX
        - TMO

market-data:
    refresh:
        enabled: ${MARKET_DATA_REFRESH_ENABLED:true}
        interval: ${MARKET_DATA_REFRESH_INTERVAL:5s}
