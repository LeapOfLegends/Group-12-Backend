services:
  capstone-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: capstone-backend:1.3.0
    container_name: capstone-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./.env.backend
    networks:
      - capstone-network

  capstone-etl:
    build:
      context: ./ETL-Pipeline
      dockerfile: Dockerfile
    image: capstone-etl:latest
    container_name: capstone-etl
    restart: unless-stopped
    env_file:
      - ./.env.etl
    networks:
      - capstone-network

networks:
  capstone-network:
    name: capstone-network
    driver: bridge