version: '3.8'

services:
  # OLTP Database (Trading Application)
  trading-db:
    image: postgres:16
    container_name: trading-db
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    ports:
      - "5432:5432"
    volumes:
      - trading_db_data:/var/lib/postgresql/data
      - ./Database-Setup:/docker-entrypoint-initdb.d
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Warehouse Database (Analytics)
  warehouse-db:
    image: postgres:18
    container_name: warehouse-db
    environment:
      POSTGRES_DB: trading_dw
      POSTGRES_USER: trading_dw
      POSTGRES_PASSWORD: trading_dw_password
    ports:
      - "55433:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql
      - ./Database-Setup/createWarehouse.sql:/docker-entrypoint-initdb.d/01-warehouse.sql
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_dw -d trading_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ETL Pipeline
  etl-pipeline:
    build: .
    container_name: trading-etl
    environment:
      OLTP_DB_HOST: trading-db
      OLTP_DB_PORT: 5432
      OLTP_DB_NAME: trading_db
      OLTP_DB_USER: trading_user
      OLTP_DB_PASSWORD: trading_password
      WH_DB_HOST: warehouse-db
      WH_DB_PORT: 5432
      WH_DB_NAME: trading_dw
      WH_DB_USER: trading_dw
      WH_DB_PASSWORD: trading_dw_password
      ETL_INTERVAL_SECONDS: 60
      ETL_MAX_RETRIES: 3
      ETL_RETRY_DELAY_SECONDS: 5
      ETL_LOG_LEVEL: INFO
      ETL_BATCH_SIZE: 1000
    depends_on:
      trading-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - trading-network
    restart: unless-stopped

networks:
  trading-network:
    driver: bridge

volumes:
  trading_db_data:
  warehouse_db_data:
