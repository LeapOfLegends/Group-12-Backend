services:
  # OLTP Database (Trading Application)
  trading-db:
    image: postgres:16
    container_name: trading-db
    environment:
      POSTGRES_DB: capstone2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    ports:
      - "15432:5432"
    volumes:
      - trading_db_data:/var/lib/postgresql/data
      - ./Database-Setup/createTables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql:ro
      - ./Database-Setup/seedTables.sql:/docker-entrypoint-initdb.d/02-seed-tables.sql:ro
      - ./Database-Setup/seedDemoClientJohnPage.sql:/docker-entrypoint-initdb.d/03-seed-demo-client.sql:ro
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capstone2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Warehouse Database (Analytics)
  warehouse-db:
    image: postgres:18
    container_name: warehouse-db
    environment:
      POSTGRES_DB: data_warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WAREHOUSE_DATASOURCE_PASSWORD:?Set WAREHOUSE_DATASOURCE_PASSWORD in .env}
    ports:
      - "15433:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql
      - ./Database-Setup/createWarehouse.sql:/docker-entrypoint-initdb.d/01-create-warehouse.sql:ro
      - ./Database-Setup/seedWarehouseData.sql:/docker-entrypoint-initdb.d/02-seed-warehouse.sql:ro
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  trading-network:
    driver: bridge

volumes:
  trading_db_data:
  warehouse_db_data:
